name: PolyEdge AI Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS }}
          POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
          POLYMARKET_API_PASSPHRASE: ${{ secrets.POLYMARKET_API_PASSPHRASE }}
          SIGNATURE_TYPE: ${{ secrets.SIGNATURE_TYPE }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          DRY_RUN: "true"
          STARTING_CAPITAL: "100.0"
          LOG_LEVEL: "INFO"
        run: |
          cd polyedge
          python run_cycle.py

      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: update market data [skip ci]"
          file_pattern: "data/*.json"
          commit_user_name: "PolyEdge AI Bot"
          commit_user_email: "polyedge-bot@users.noreply.github.com"

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polyedge-error-log
          path: polyedge/polyedge.log
          retention-days: 3
